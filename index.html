<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="logo-sawo.png">
<title>SAWO Hub</title>
<style>
  :root{
    --bg-top:#eef0fb;
    --bg-bottom:#e4e7f6;
    --card-bg:#ffffff;
    --card-border:#e8e8ef;
    --text:#3a3a4a;
    --label:#4a4a5a;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-hover: 0 8px 20px rgba(60,60,100,0.12);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    color:var(--text);
    overflow-x:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
  }
  .bg-hub{
    position:fixed;
    right:-140px;
    bottom:-140px;
    width:min(720px, 85vw);
    height:auto;
    opacity:0.5;
    pointer-events:none;
    z-index:0;
  }
  .bg-hub .spin{
    transform-origin:400px 420px;
    animation:hub-spin 150s linear infinite;
  }
  .bg-hub .spin-rev{
    transform-origin:400px 420px;
    animation:hub-spin 200s linear infinite reverse;
  }
  @keyframes hub-spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){
    .bg-hub .spin, .bg-hub .spin-rev{ animation:none; }
  }
  header, main{
    position:relative;
    z-index:1;
  }
  header{
    padding:28px 40px 8px 40px;
    text-align:center;
  }
  header .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  header .brand img{
    width:30px;
    height:30px;
    object-fit:contain;
  }
  header h1{
    font-size:22px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
    color:#33334a;
  }
  header p{
    margin:4px 0 0 0;
    font-size:13px;
    color:#8888a0;
  }
  main{
    padding:20px 40px 60px 40px;
    display:flex;
    justify-content:center;
    width:100%;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4, 136px);
    gap:22px 26px;
    justify-content:center;
    max-width:960px;
  }
  a.tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-decoration:none;
    color:inherit;
    outline:none;
  }
  .icon-box{
    width:92px;
    height:92px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.tile:hover .icon-box{
    transform:translateY(-3px);
    box-shadow:var(--shadow-hover);
  }
  a.tile:active .icon-box{
    transform:translateY(0);
  }
  .icon-box svg{
    width:48px;
    height:48px;
  }
  .label{
    margin-top:10px;
    font-size:13px;
    font-weight:500;
    color:var(--label);
    text-align:center;
    line-height:1.3;
    max-width:120px;
  }
  .badge{
    font-size:9px;
    font-weight:600;
    color:#9a7b00;
    background:#fff3cd;
    border-radius:6px;
    padding:1px 6px;
    margin-top:4px;
    display:inline-block;
  }
</style>
</head>
<body>

  <!-- bond lines connecting the ion clusters, irregular thickness -->

    <line x1="400" y1="420" x2="590" y2="300" stroke="url(#hubStroke)" stroke-width="6"/>
    <line x1="400" y1="420" x2="650" y2="490" stroke="url(#hubStroke)" stroke-width="5"/>
    <line x1="400" y1="420" x2="520" y2="590" stroke="url(#hubStroke2)" stroke-width="7"/>
    <line x1="400" y1="420" x2="300" y2="560" stroke="url(#hubStroke)" stroke-width="4"/>
    <line x1="400" y1="420" x2="190" y2="430" stroke="url(#hubStroke2)" stroke-width="6"/>
    <line x1="590" y1="300" x2="470" y2="185" stroke="url(#hubStroke)" stroke-width="5"/>
    <line x1="190" y1="430" x2="250" y2="250" stroke="url(#hubStroke)" stroke-width="4"/>
    <line x1="520" y1="590" x2="630" y2="650" stroke="url(#hubStroke2)" stroke-width="4"/>
    <line x1="190" y1="430" x2="130" y2="610" stroke="url(#hubStroke)" stroke-width="3"/>
  </g>

  <!-- irregular interlinking rings: varied sizes, thick outlines, scattered placement -->
  <g class="spin">
    <circle cx="400" cy="420" r="155" stroke="url(#hubStroke)"  stroke-width="8"/>
    <circle cx="590" cy="300" r="95"  stroke="url(#hubStroke2)" stroke-width="7"/>
    <circle cx="650" cy="490" r="78"  stroke="url(#hubStroke)"  stroke-width="5"/>
    <circle cx="520" cy="590" r="118" stroke="url(#hubStroke2)" stroke-width="7"/>
    <circle cx="300" cy="560" r="88"  stroke="url(#hubStroke)"  stroke-width="6"/>
    <circle cx="190" cy="430" r="112" stroke="url(#hubStroke2)" stroke-width="8"/>
    <circle cx="250" cy="250" r="72"  stroke="url(#hubStroke)"  stroke-width="5"/>
    <circle cx="470" cy="185" r="58"  stroke="url(#hubStroke2)" stroke-width="6"/>
    <circle cx="630" cy="650" r="48"  stroke="url(#hubStroke)"  stroke-width="4"/>
    <circle cx="130" cy="610" r="40"  stroke="url(#hubStroke2)" stroke-width="4"/>

    <!-- ion nodes: scattered, uneven sizes, bold outline -->
    <g fill="#ffffff">
      <circle cx="400" cy="420" r="13" stroke="url(#hubStroke)"  stroke-width="5"/>
      <circle cx="590" cy="300" r="10" stroke="url(#hubStroke2)" stroke-width="4"/>
      <circle cx="650" cy="490" r="8"  stroke="url(#hubStroke)"  stroke-width="4"/>
      <circle cx="520" cy="590" r="12" stroke="url(#hubStroke2)" stroke-width="5"/>
      <circle cx="300" cy="560" r="9"  stroke="url(#hubStroke)"  stroke-width="4"/>
      <circle cx="190" cy="430" r="11" stroke="url(#hubStroke2)" stroke-width="5"/>
      <circle cx="470" cy="185" r="7"  stroke="url(#hubStroke2)" stroke-width="3.5"/>
      <circle cx="630" cy="650" r="6"  stroke="url(#hubStroke)"  stroke-width="3"/>
      <circle cx="130" cy="610" r="6"  stroke="url(#hubStroke2)" stroke-width="3"/>
      <circle cx="250" cy="250" r="7"  stroke="url(#hubStroke)"  stroke-width="3.5"/>
    </g>
  </g>

  <!-- a few free-floating ions, not attached to anything -->
  <g fill="#ffffff">
    <circle cx="700" cy="360" r="5" stroke="url(#hubStroke)" stroke-width="3"/>
    <circle cx="120" cy="300" r="4" stroke="url(#hubStroke2)" stroke-width="2.5"/>
    <circle cx="560" cy="690" r="4.5" stroke="url(#hubStroke)" stroke-width="3"/>
  </g>
</svg>
